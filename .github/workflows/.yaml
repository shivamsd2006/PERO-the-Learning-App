name: Deploy Frontend

on:
  push:
    branches: ["react-version"]
    # Optional: Only run if files in 'Frontend' change
    paths:
      - 'Frontend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    # VITAL: Tell all "run" commands to execute inside the Frontend folder
    defaults:
      run:
        working-directory: ./Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          # VITAL: Tell caching where the package-lock.json is
          cache-dependency-path: './Frontend/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # VITAL: Point to the build folder inside Frontend
          path: ./Frontend/dist 

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4